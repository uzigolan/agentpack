name: Feature request
description: Suggest a capability, CLI command or manifest field.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: If it affects the manifest, sketch the YAML.
      render: yaml

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
